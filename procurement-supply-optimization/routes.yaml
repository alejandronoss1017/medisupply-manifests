apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: procurement-supply-optimization-route
spec:
  # The name of the Gateway that this route belongs to
  parentRefs:
    - name: medisupply-gateway
      namespace: default
  rules:
    # Contracts service routing
    - matches:
        - path:
            type: PathPrefix
            value: /api/v1/contracts
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: contracts-service
          port: 8080