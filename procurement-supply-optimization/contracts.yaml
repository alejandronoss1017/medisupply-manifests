apiVersion: v1
kind: Service
metadata:
  name: contracts-service
  labels:
    app: contracts-service
    service: contracts-service
spec:
  ports:
  - port: 3000
    name: http
  selector:
    app: contracts-service
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: medisupply-contracts-service
  labels:
    account: contracts-service
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: contracts-service-v1
  labels:
    app: contracts-service
    version: v1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: contracts-service
      version: v1
  template:
    metadata:
      labels:
        app: contracts-service
        version: v1
    spec:
      serviceAccountName: medisupply-contracts-service

      containers:
