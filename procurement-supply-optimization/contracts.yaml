      - name: contracts-worker
        image: public.ecr.aws/a7x9j8u1/medisupply/procurement-supply-optimization/contracts-worker-service:latest
        imagePullPolicy: Always
        env:
          - name: SERVICE_NAME
            value: "CONTRACTS-MS-WORKER"
          - name: KAFKA_BROKERS
            value: "my-cluster-kafka-bootstrap.procurement-supply-optimization.svc.cluster.local:9092"
          - name: KAFKA_CLIENT_ID
            value: "contracts-ms-worker"
          - name: KAFKA_GROUP_ID
            value: "contracts-workers"
          - name: KAFKA_TOPICS
            value: "medicine.events"
          - name: DDB_TABLE
            value: "contracts-db"
          - name: AWS_REGION
            value: "us-east-2"
          - name: KAFKA_DEFAULT_PARTITIONS
            value: "1"
          - name: KAFKA_DEFAULT_REPLICATION_FACTOR
            value: "1"
