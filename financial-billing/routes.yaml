apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: financial-billing-route
spec:
  # The name of the Gateway that this route belongs to
  parentRefs:
    - name: medisupply-gateway
      namespace: default
  rules:
    # Purchases service routing
    - matches:
        - path:
            type: PathPrefix
            value: /api/v1/purchases
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: purchases
          port: 8080
    - matches:
        - path:
            type: PathPrefix
            value: /rabbitmq
      backendRefs:
        - name: rabbitmq
          port: 15672
