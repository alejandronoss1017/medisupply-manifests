##################################################################################################
# purchases service
##################################################################################################
apiVersion: v1
kind: Service
metadata:
  name: purchases-service
  namespace: financial-billing
  labels:
    app: purchases-service
    service: purchases-service
spec:
  ports:
    - port: 8080
      name: http
  selector:
    app: purchases
---
##################################################################################################
# purchases service account
##################################################################################################
apiVersion: v1
kind: ServiceAccount
metadata:
  name: medisupply-purchases
  labels:
    account: purchases
---
##################################################################################################
# purchases deployment
##################################################################################################
apiVersion: apps/v1
kind: Deployment
metadata:
  name: purchases
  namespace: financial-billing
  labels:
    app: purchases
spec:
  replicas: 1
  selector:
    matchLabels:
      app: purchases
  template:
    metadata:
      name: purchases
      labels:
        app: purchases
    spec:
      containers:
        - name: purchases
          image: public.ecr.aws/a7x9j8u1/medisupply/financial-billing/purchases-web-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: RABBITMQ_USER
              valueFrom:
                secretKeyRef:
                  name: purchases-app-queue-user-credentials
                  key: username
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: purchases-app-queue-user-credentials
                  key: password
            # Use FQDN (Fully Qualified Domain Name)
            - name: RABBITMQ_HOST
              value: rabbitmq.financial-billing.svc.cluster.local
          readinessProbe:
            httpGet:
              path: /ping
              port: 8080
          livenessProbe:
            httpGet:
              path: /ping
              port: 8080
      restartPolicy: Always
