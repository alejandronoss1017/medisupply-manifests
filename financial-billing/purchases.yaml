##################################################################################################
# purchases service
##################################################################################################
apiVersion: v1
kind: Service
metadata:
  name: purchases
  labels:
    app: purchases
    service: purchases
spec:
  ports:
    - port: 8080
      name: http
  selector:
    app: purchases
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: medisupply-purchases
  labels:
    account: purchases
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: purchases-v1
  labels:
    app: purchases
    version: v1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: purchases
      version: v1
  template:
    metadata:
      labels:
        app: purchases
        version: v1
    spec:
      serviceAccountName: medisupply-purchases
      containers:
        - name: purchases-web
          image: public.ecr.aws/q2b4w2e6/dummies/purchases-ms-web:1.0.1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: RABBITMQ_USER
              valueFrom:
                secretKeyRef:
                  name: purchases-app-queue-user-credentials
                  key: username
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: purchases-app-queue-user-credentials
                  key: password
            # Use FQDN (Fully Qualified Domain Name)
            - name: RABBITMQ_HOST
              value: rabbitmq.financial-billing.svc.cluster.local
        - name: purchases-worker
          image: public.ecr.aws/q2b4w2e6/dummies/purchases-ms-worker
          imagePullPolicy: IfNotPresent
          env:
            - name: RABBITMQ_USER
              valueFrom:
                secretKeyRef:
                  name: purchases-app-queue-user-credentials
                  key: username
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: purchases-app-queue-user-credentials
                  key: password
            # Use FQDN (Fully Qualified Domain Name)
            - name: RABBITMQ_HOST
              value: rabbitmq.financial-billing.svc.cluster.local