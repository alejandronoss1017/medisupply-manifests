##################################################################################################
# purchases service
##################################################################################################
apiVersion: v1
kind: Service
metadata:
  name: purchases
  labels:
    app: purchases
    service: purchases
spec:
  ports:
    - port: 8080
      name: http
  selector:
    app: purchases
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: medisupply-purchases
  labels:
    account: purchases
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: purchases-v1
  labels:
    app: purchases
    version: v1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: purchases
      version: v1
  template:
    metadata:
      labels:
        app: purchases
        version: v1
    spec:
      serviceAccountName: medisupply-purchases
      containers:
        - name: purchases-web
          image: public.ecr.aws/a7x9j8u1/medisupply/financial-billing/purchases-web-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: RABBITMQ_USER
              valueFrom:
                secretKeyRef:
                  name: purchases-app-queue-user-credentials
                  key: username
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: purchases-app-queue-user-credentials
                  key: password
            # Use FQDN (Fully Qualified Domain Name)
            - name: RABBITMQ_HOST
              value: rabbitmq.financial-billing.svc.cluster.local
          livenessProbe:
            httpGet:
              path: /ping
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ping
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
        - name: purchases-worker
          image: public.ecr.aws/a7x9j8u1/medisupply/financial-billing/purchases-worker-service:1.0.0
          imagePullPolicy: Always
          env:
            - name: RABBITMQ_USER
              valueFrom:
                secretKeyRef:
                  name: purchases-app-queue-user-credentials
                  key: username
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: purchases-app-queue-user-credentials
                  key: password
            # Use FQDN (Fully Qualified Domain Name)
            - name: RABBITMQ_HOST
              value: rabbitmq.financial-billing.svc.cluster.local
            - name: RABBITMQ_QUEUE
              value: purchases.events
          # Liveness probe using TCP socket
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10