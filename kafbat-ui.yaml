---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kafbat-ui-config
  namespace: kafka-system
data:
  config.yml: |
    kafka:
      clusters:
        - name: my-cluster
          bootstrapServers: my-cluster-kafka-bootstrap.purchasing-supply-optimization.svc.cluster.local:9092
          properties: {}
    auth:
      type: disabled
    management:
      health:
        ldap:
          enabled: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafbat-ui
  namespace: kafka-system
  labels:
    app: kafbat-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafbat-ui
  template:
    metadata:
      labels:
        app: kafbat-ui
    spec:
      containers:
      - name: kafbat-ui
        image: ghcr.io/kafbat/kafka-ui:latest
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        env:
        - name: SPRING_CONFIG_ADDITIONAL-LOCATION
          value: /etc/kafbat/config.yml
        - name: LOGGING_LEVEL_ROOT
          value: INFO
        - name: LOGGING_LEVEL_COM_PROVECTUS
          value: INFO
        volumeMounts:
        - name: config
          mountPath: /etc/kafbat
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
      volumes:
      - name: config
        configMap:
          name: kafbat-ui-config
---
apiVersion: v1
kind: Service
metadata:
  name: kafbat-ui
  namespace: kafka-system
  labels:
    app: kafbat-ui
spec:
  type: ClusterIP
  ports:
  - port: 8080
    targetPort: 8080
    protocol: TCP
    name: http
  selector:
    app: kafbat-ui
