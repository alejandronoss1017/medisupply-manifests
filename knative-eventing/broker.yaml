##################################################################################################
# In-Memory Broker Configuration for Knative Eventing
##################################################################################################
# This creates a Knative Broker using in-memory channel backend (MTChannelBasedBroker)
# NOTE: In-memory brokers are NOT persistent - events are lost on pod restart
# Use this for development/testing only. For production, use RabbitMQ or Kafka brokers.
---
# In-Memory Broker in default namespace
apiVersion: eventing.knative.dev/v1
kind: Broker
metadata:
  name: medisupply-broker
  namespace: default
  annotations:
    eventing.knative.dev/broker.class: MTChannelBasedBroker
spec:
  config:
    apiVersion: v1
    kind: ConfigMap
    name: config-br-default-channel
    namespace: knative-eventing