##################################################################################################
# TRIGGER: Route Purchase Events to Subscribers
##################################################################################################
# This Trigger subscribes to purchase-related events from the broker and routes them
# to interested services
#
# Flow: Broker → Filter (event type) → Subscriber Service
#
# Event Filtering:
# - Only events matching the filter criteria are delivered
# - Uses CloudEvents attributes for filtering (type, source, etc.)
apiVersion: eventing.knative.dev/v1
kind: Trigger
metadata:
  name: purchases-events-trigger
  namespace: default
  labels:
    app: event-mesh
    component: trigger
    event-type: purchases
spec:
  # Source broker
  broker: medisupply-broker
  
  # Event Type Filter
  # Only events with this type will be routed to the subscriber
  # CloudEvents type format: <domain>.<entity>.<action>
  filter:
    attributes:
      # Filter for purchase-related events
      # Adjust based on actual event types from your RabbitMQ messages
      type: com.medisupply.financial.purchase.created
  
  # Subscriber: Service that will receive the events
  # REPLACE THIS with your actual service that processes purchase events
  subscriber:
    ref:
      apiVersion: v1
      kind: Service
      name: purchases-event-subscriber
      namespace: default
    # If your service expects events at a specific path:
    # uri: /events/purchases
  
  # Delivery Configuration
  delivery:
    # Retry failed deliveries
    retry: 3
    backoffPolicy: exponential
    backoffDelay: PT1S
    
    # Dead letter sink if all retries fail
    deadLetterSink:
      ref:
        apiVersion: v1
        kind: Service
        name: event-dead-letter-sink
        namespace: default

---
##################################################################################################
# TRIGGER: Route Invoice Events to Subscribers
##################################################################################################
# This Trigger subscribes to invoice-related events from the broker
apiVersion: eventing.knative.dev/v1
kind: Trigger
metadata:
  name: invoices-events-trigger
  namespace: default
  labels:
    app: event-mesh
    component: trigger
    event-type: invoices
spec:
  broker: medisupply-broker
  
  # Event Type Filter
  filter:
    attributes:
      # Filter for invoice-related events
      type: com.medisupply.financial.invoice.created
  
  # Subscriber: Service that will receive the events
  # REPLACE THIS with your actual service that processes invoice events
  subscriber:
    ref:
      apiVersion: v1
      kind: Service
      name: invoices-event-subscriber
      namespace: default
  
  delivery:
    retry: 3
    backoffPolicy: exponential
    backoffDelay: PT1S
    deadLetterSink:
      ref:
        apiVersion: v1
        kind: Service
        name: event-dead-letter-sink
        namespace: default

---
##################################################################################################
# TRIGGER: Catch-All for Unfiltered Events
##################################################################################################
# This trigger captures all events that don't match specific filters above
# Useful for debugging, monitoring, and ensuring no events are lost
apiVersion: eventing.knative.dev/v1
kind: Trigger
metadata:
  name: event-mesh-monitor-trigger
  namespace: default
  labels:
    app: event-mesh
    component: trigger
    event-type: monitor
spec:
  broker: medisupply-broker
  
  # No filter = receives all events
  # This is useful for monitoring and debugging
  
  # Subscriber: Event display service for monitoring
  subscriber:
    ref:
      apiVersion: v1
      kind: Service
      name: event-mesh-monitor
      namespace: default
  
  delivery:
    retry: 1
    backoffPolicy: linear
    backoffDelay: PT1S
