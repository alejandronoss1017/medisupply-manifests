apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: purchasing-supply-optimization-route
  namespace: purchasing-supply-optimization
spec:
  parentRefs:
    - name: medisupply-gateway
      namespace: default
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api/v1    # <— match /api/v1 (not /api/v1/suppliers)
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /   # <— so /api/v1/suppliers -> /suppliers
      backendRefs:
        - name: suppliers
          port: 8080
