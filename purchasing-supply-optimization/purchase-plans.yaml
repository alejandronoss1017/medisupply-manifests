apiVersion: v1
kind: Service
metadata:
  name: purchase-plans-service
  labels:
    app: purchase-plans-service
    service: purchase-plans-service
spec:
  ports:
    - port: 3000
      name: http
  selector:
    app: purchase-plans-service
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: medisupply-purchase-plans-service
  labels:
    account: purchase-plans-service
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: purchase-plans-service-v1
  labels:
    app: purchase-plans-service
    version: v1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: purchase-plans-service
      version: v1
  template:
    metadata:
      labels:
        app: purchase-plans-service
        version: v1
    spec:
      serviceAccountName: medisupply-purchase-plans-service

      containers:
        #      - name: purchase-plans-service
        #        image: public.ecr.aws/a7x9j8u1/medisupply/procurement-supply-optimization/purchase-plans-web-service:latest
        #        imagePullPolicy: Always
        #        ports:
        #        - containerPort: 3000
        #        env:
        #          - name: SERVICE_NAME
        #            value: "Purchase Plan Service"
        #          - name: KAFKA_BROKERS
        #            value: "my-cluster-kafka-bootstrap.procurement-supply-optimization.svc.cluster.local:9092"
        #          - name: KAFKA_CLIENT_ID
        #            value: "purchase-plans-service"
        #          - name: PORT
        #            value: "3000"
        #        resources:
        #          requests:
        #            memory: "128Mi"
        #            cpu: "100m"
        #          limits:
        #            memory: "256Mi"
        #            cpu: "200m"
        #        readinessProbe:
        #          httpGet:
        #            path: /health
        #            port: 3000
        #          initialDelaySeconds: 2
        #          periodSeconds: 5
        #        livenessProbe:
        #          httpGet:
        #            path: /health
        #            port: 3000
        #          initialDelaySeconds: 5
        #          periodSeconds: 10
        - name: purchase-plans-worker
          image: public.ecr.aws/a7x9j8u1/medisupply/procurement-supply-optimization/purchase-plans-worker-service:latest
          imagePullPolicy: Always
          env:
            - name: SERVICE_NAME
              value: "PURCHASE-PLANS-MS-WORKER"
            - name: KAFKA_BROKERS
              value: "my-cluster-kafka-bootstrap.purchasing-supply-optimization.svc.cluster.local:9092"
            - name: KAFKA_CLIENT_ID
              value: "purchase-plans-ms-worker"
            - name: KAFKA_GROUP_ID
              value: "purchase-plans-workers"
            - name: KAFKA_TOPICS
              value: "medicine.events"
            - name: DDB_TABLE
              value: "purchase-plans-db"
            - name: AWS_REGION
              value: "us-east-1"
            - name: KAFKA_DEFAULT_PARTITIONS
              value: "1"
            - name: KAFKA_DEFAULT_REPLICATION_FACTOR
              value: "1"
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
          # Liveness probe using TCP socket
          livenessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10